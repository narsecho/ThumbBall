# ThumbBall T9: based on iDvel/rime-ice t9.schema.yaml (GPL-3.0).
# A minimal built-in-component configuration; no Lua plugin is required.
schema:
  schema_id: thumbball_t9
  name: ThumbBall 九宫格拼音
  version: "1.0"
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [uniquifier]
speller:
  alphabet: "23456789'"
  delimiter: "'"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/
translator:
  dictionary: thumbball
  prism: thumbball_t9
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 100
  preedit_format: []
menu:
  page_size: 9
